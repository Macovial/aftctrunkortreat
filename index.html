<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFTC Trunk or Treat 2026</title>
<meta name="description" content="AFTC's 4th Annual Trunk or Treat.">
<meta name="theme-color" content="#2b1a4a">
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    display: grid;
    place-items: center;
    background: #2b1a4a;
    color: #f8f4ff;
    font: 400 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  h1 {
    margin: 0 0 4px;
    font-size: clamp(28px, 7vw, 52px);
    font-weight: 800;
    letter-spacing: -0.02em;
    color: #f3a712;
  }
  .kicker {
    margin: 0 0 20px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: .75;
  }
  p { margin: 0; opacity: .8; }
</style>
</head>
<body>
  <div>
    <p class="kicker">AFTC 4th Annual</p>
    <h1>Trunk or Treat 2026</h1>
    <p>Registration and volunteer sign-up open soon.</p>
  </div>
</body>
</html>
