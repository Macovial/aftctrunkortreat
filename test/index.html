<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Embed Test</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: #14121a;
    color: #f2eef8;
    font: 400 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .note { opacity: .65; font-size: 13px; margin: 0 0 20px; }
  .panel { margin-bottom: 28px; }
  .label {
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .tag {
    background: #f3a712;
    color: #14121a;
    font-weight: 800;
    font-size: 12px;
    padding: 3px 9px;
    border-radius: 4px;
    letter-spacing: .04em;
  }
  .label strong { font-size: 14px; }
  .label code {
    font-size: 11px;
    opacity: .55;
    word-break: break-all;
  }
  .box {
    height: 420px;
    border: 2px dashed #4a4160;
    border-radius: 8px;
    overflow: hidden;
    background: #000;
  }
  .box iframe { width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>

<h1>Embed test</h1>
<p class="note">If a box below shows the Trunk or Treat form, that URL works. If it stays black or empty, that URL is blocked.</p>

<div class="panel">
  <div class="label">
    <span class="tag">TEST A</span>
    <strong>Short URL</strong>
    <code>/</code>
  </div>
  <div class="box">
    <iframe
      src="https://db9d2662-cee9-433b-88d5-6934b36dc787.frame.claudeusercontent.com/"
      title="Test A"
      referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </div>
</div>

<div class="panel">
  <div class="label">
    <span class="tag">TEST B</span>
    <strong>Full URL with build hash</strong>
    <code>/_f/1788764195-675f/?__frame_v=manifest...</code>
  </div>
  <div class="box">
    <iframe
      src="https://db9d2662-cee9-433b-88d5-6934b36dc787.frame.claudeusercontent.com/_f/1788764195-675f/?__frame_v=manifest.44244f2523adb29d.json"
      title="Test B"
      referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </div>
</div>

</body>
</html>
